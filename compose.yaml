x-app: &app
  build: .
  env_file: .env.cloud
  environment:
    SNACKY_MODE: cloud
    SNACKY_DATABASE_URL: ${SNACKY_DATABASE_URL:-postgresql+psycopg://snacky:${POSTGRES_PASSWORD:?Generate .env.cloud first}@postgres:5432/snacky}
    SNACKY_REDIS_URL: redis://redis:6379/0
    SNACKY_PUBLIC_ORIGIN: ${SNACKY_PUBLIC_ORIGIN:-http://localhost:8080}
    SNACKY_S3_ENDPOINT: http://object-store:9000
    SNACKY_S3_PUBLIC_ENDPOINT: ${SNACKY_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    SNACKY_S3_BUCKET: snacky-media
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Generate .env.cloud first}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Generate .env.cloud first}
    AWS_DEFAULT_REGION: us-east-1
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snacky
      POSTGRES_DB: snacky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snacky -d snacky"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  object-store:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["media-data:/data"]
    restart: unless-stopped
  bucket:
    <<: *app
    depends_on: [object-store]
    command: ["python", "scripts/init_bucket.py"]
    restart: "no"
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    expose: ["8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  worker:
    <<: *app
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      bucket: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  media-data:
