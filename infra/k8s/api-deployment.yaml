# Production Reference: Scalable FastAPI Replicas with HPA and PodDisruptionBudget
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snacky-api
  namespace: snacky
  labels:
    app: snacky-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snacky-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: snacky-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["snacky-api"]
                topologyKey: "topology.kubernetes.io/zone"
      containers:
        - name: api
          image: snacky-studio:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: snacky-secrets
            - configMapRef:
                name: snacky-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snacky-api-hpa
  namespace: snacky
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snacky-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: snacky-api-pdb
  namespace: snacky
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: snacky-api

