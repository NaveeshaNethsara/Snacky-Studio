name: Build Windows desktop
on: [workflow_dispatch]
permissions: {contents: read}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-dev.txt
      - run: npm ci; npm run build
        working-directory: frontend
      - run: python -c "import static_ffmpeg; static_ffmpeg.add_paths()"
      - run: python scripts/build_sidecar.py
      - run: python -m tests.sidecar_smoke
      - run: npm run desktop:build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with: {name: Snacky-Studio-Windows-installer, path: frontend/src-tauri/target/release/bundle/nsis/*.exe}
